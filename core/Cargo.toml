[package]
name = "maplay-core"
version = "0.1.0"
description = "Playback engine, library and Core Audio bindings for Maplay"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "maplay_core"
path = "src/lib.rs"

[dependencies]
objc2-core-audio-types = "0.3.2"
objc2-audio-toolbox = { version = "0.3.2", default-features = false, features = ["std", "AUComponent", "AudioComponent", "AudioOutputUnit", "AudioUnitProperties", "ExtendedAudioFile", "AudioFile", "objc2-core-foundation", "objc2-core-audio-types"] }
objc2-core-foundation = "0.3.2"
rtrb = "0.4.0"
thiserror = "2.0.21"
symphonia = { version = "0.6.1", default-features = false, features = ["ogg", "vorbis"] }
objc2-core-audio = { version = "0.3.2", default-features = false, features = ["std", "AudioHardware", "objc2-core-audio-types"] }
lofty = "0.25.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
notify = "=8.2.0"
walkdir = "2.5.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
tempfile = "3.27.0"
